name: Convert MP4 uploads to GIF

# The gallery lets users upload MP4 (X "GIFs" are really MP4). When an MP4
# lands under stickers/, convert it to a GIF, update index.json, and commit.
# The Action's own commit only touches .gif/.json, so it never re-triggers.
on:
  push:
    branches: [main]
    paths:
      - 'stickers/**/*.mp4'

permissions:
  contents: write

concurrency:
  group: mp4-to-gif
  cancel-in-progress: false

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Convert MP4 files to GIF
        run: python3 scripts/convert-mp4.py
      - name: Commit converted GIFs
        run: |
          git config user.name "Konata"
          git config user.email "66293673+murasaki-nin@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "convert mp4 uploads to gif [skip actions]"
          git push
