<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>表情包相册 · meme-library</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #fafafa; color: #222; }
  header { position: sticky; top: 0; background: #fff; border-bottom: 1px solid #eee; padding: 12px 16px; z-index: 10; }
  h1 { font-size: 18px; margin: 0 0 8px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  input[type="search"] { flex: 1; min-width: 140px; padding: 8px 10px; font-size: 15px; border: 1px solid #ddd; border-radius: 8px; }
  select { padding: 8px; font-size: 15px; border: 1px solid #ddd; border-radius: 8px; background: #fff; }
  #count { font-size: 13px; color: #888; }
  main { padding: 12px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; }
  .card { background: #fff; border: 1px solid #eee; border-radius: 10px; overflow: hidden; cursor: pointer; }
  .card img { width: 100%; height: 120px; object-fit: cover; display: block; background: #f2f2f2; }
  .card .tags { padding: 6px 8px; font-size: 12px; color: #666; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card .gif-badge { display: inline-block; background: #222; color: #fff; font-size: 10px; border-radius: 4px; padding: 1px 5px; margin-right: 4px; }
  #viewer { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 20; align-items: center; justify-content: center; flex-direction: column; padding: 16px; }
  #viewer.open { display: flex; }
  #viewer img { max-width: 100%; max-height: 70vh; border-radius: 10px; background: #fff; }
  #viewer .info { color: #fff; margin-top: 12px; font-size: 14px; text-align: center; }
  #viewer a { color: #fff; }
  #viewer .close { position: absolute; top: 12px; right: 16px; color: #fff; font-size: 28px; cursor: pointer; background: none; border: none; }
  #empty { text-align: center; color: #999; padding: 40px 0; display: none; }
</style>
</head>
<body>
<header>
  <h1>表情包相册</h1>
  <div class="row">
    <select id="character">
      <option value="">全部角色</option>
    </select>
    <input id="search" type="search" placeholder="搜标签，比如：跳舞、大笑、抽象">
    <span id="count"></span>
  </div>
</header>
<main>
  <div class="grid" id="grid"></div>
  <div id="empty">没有匹配的表情包，换个词试试。</div>
</main>
<div id="viewer">
  <button class="close" id="closeBtn" aria-label="关闭">&times;</button>
  <img id="viewerImg" alt="">
  <div class="info" id="viewerInfo"></div>
</div>
<script>
let items = [];

function render() {
  const char = document.getElementById('character').value;
  const q = document.getElementById('search').value.trim();
  const grid = document.getElementById('grid');
  const empty = document.getElementById('empty');
  grid.innerHTML = '';
  const shown = items.filter(it => {
    if (char && it.character !== char) return false;
    if (q) {
      const hay = (it.tags || []).join(' ') + ' ' + it.id;
      if (!hay.includes(q)) return false;
    }
    return true;
  });
  document.getElementById('count').textContent = '共 ' + shown.length + ' 张';
  empty.style.display = shown.length ? 'none' : 'block';
  for (const it of shown) {
    const card = document.createElement('div');
    card.className = 'card';
    const badge = it.animated ? '<span class="gif-badge">GIF</span>' : '';
    card.innerHTML = '<img loading="lazy" src="' + it.file + '" alt="' + it.id + '">'
      + '<div class="tags">' + badge + (it.tags || []).join(' · ') + '</div>';
    card.onclick = () => openViewer(it);
    grid.appendChild(card);
  }
}

function openViewer(it) {
  document.getElementById('viewerImg').src = it.file;
  document.getElementById('viewerInfo').innerHTML =
    (it.tags || []).join(' · ') + '<br><a href="' + it.file + '" download>保存原图</a>';
  document.getElementById('viewer').classList.add('open');
}

document.getElementById('closeBtn').onclick = () => {
  document.getElementById('viewer').classList.remove('open');
};
document.getElementById('viewer').onclick = (e) => {
  if (e.target.id === 'viewer') document.getElementById('viewer').classList.remove('open');
};
document.getElementById('search').oninput = render;
document.getElementById('character').onchange = render;

fetch('index.json')
  .then(r => r.json())
  .then(data => {
    items = data.items || [];
    const chars = [...new Set(items.map(i => i.character))];
    const sel = document.getElementById('character');
    for (const c of chars) {
      const opt = document.createElement('option');
      opt.value = c; opt.textContent = c;
      sel.appendChild(opt);
    }
    render();
  })
  .catch(() => {
    document.getElementById('empty').textContent = 'index.json 加载失败，请检查网络。';
    document.getElementById('empty').style.display = 'block';
  });
</script>
</body>
</html>
